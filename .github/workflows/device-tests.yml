name: Android PDF and scanner device tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pagomi-device-tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-device:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android platform
        run: |
          SDKMGR=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0"
      - name: Configure emulator acceleration with software fallback
        shell: bash
        run: |
          if [ -c /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
          fi
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM available; emulator runner will use hardware acceleration."
          else
            echo "KVM unavailable; enabling emulator software CPU emulation."
            echo "ANDROID_I_WANT_MY_TCG=yes" >> "$GITHUB_ENV"
          fi
      - name: Run PDF engine, OCR and viewer tests in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 4096M
          disk-size: 8G
          disable-animations: true
          disable-linux-hw-accel: auto
          emulator-boot-timeout: 1800
          script: |
            ./gradlew :app:connectedDebugAndroidTest -PsideBySide --no-daemon --stacktrace
            python3 scripts/capture_ci_screens.py
      - name: Upload genuine Android screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pagomi-actual-screen-captures
          path: build/visual-evidence/
          if-no-files-found: warn
      - name: Upload device test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pagomi-device-test-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
