name: Android PDF and scanner device tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pagomi-device-tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-device:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android platform
        run: |
          SDKMGR=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0"
      - name: Enable Android emulator KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run PDF engine, OCR and viewer tests in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 4096M
          disk-size: 8G
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          script: ./gradlew :app:connectedDebugAndroidTest -PsideBySide --no-daemon --stacktrace
      - name: Upload device test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pagomi-device-test-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
