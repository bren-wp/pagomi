name: pagomi. debug preview release

on:
  push:
    branches:
      - main
      - feat/pagomi-design-system
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/debug-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pagomi-debug-preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Prepare Android SDK
        run: |
          SDKMGR=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK, debug AAB and unit tests
        run: ./gradlew :app:assembleDebug :app:bundleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Check 16 KB page-size support of native libraries
        run: python3 scripts/check_native_16k.py app/build/outputs/apk/debug/app-debug.apk
      - name: Validate Android lint before publishing
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace
      - name: Collect preview artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/pagomi-0.1.4-debug.apk
          cp app/build/outputs/bundle/debug/app-debug.aab dist/pagomi-0.1.4-debug.aab
          sha256sum dist/* > dist/SHA256SUMS.txt
      - name: Upload preview builds
        uses: actions/upload-artifact@v7
        with:
          name: pagomi-debug-preview
          path: dist/
          if-no-files-found: error
      - name: Publish GitHub debug prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v0.1.4-debug.${GITHUB_SHA:0:7}"
          gh release create "$TAG" dist/pagomi-0.1.4-debug.apk dist/pagomi-0.1.4-debug.aab dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "pagomi. 0.1.4 · Debug Preview" --prerelease \
            --notes "Debug-only preview for testing pagomi. – PDF Scanner & Editor. APK uses Android's standard debug signing key. The AAB is a development artifact and is not a Play Store publishing bundle. Source: this tagged commit."
